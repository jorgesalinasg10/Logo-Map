<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <script crossorigin
    src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>

  <script crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>

  <script
    src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js">
  </script>
</head>

<body style="font-family:Arial;padding:20px;">
<div id="root">Waiting for Sigma...</div>

<script>
const {
  client,
  SigmaClientProvider,
  useConfig,
  useElementData
} = window.SigmaPlugin;

client.config.configureEditorPanel([
  { name: "source", type: "element", label: "Data Source" },

  {
    name: "score",
    type: "column",
    source: "source",
    label: "Deal Score",
    allowMultiple: false
  },

  {
    name: "revenue",
    type: "column",
    source: "source",
    label: "AAV Net",
    allowMultiple: false
  },

  {
    name: "company",
    type: "column",
    source: "source",
    label: "Company Name",
    allowMultiple: false
  },

  {
    name: "logo",
    type: "column",
    source: "source",
    label: "Logo URL",
    allowMultiple: false
  }
]);

function App() {

  const config = useConfig() || {};
  const data = useElementData("source") || {};

  const rowCounts = Object.fromEntries(
    Object.entries(data).map(([key, values]) => [
      key,
      Array.isArray(values) ? values.length : 0
    ])
  );

  return React.createElement(
    "pre",
    null,
    JSON.stringify({
      SCORE: config.score || null,
      REVENUE: config.revenue || null,
      COMPANY: config.company || null,
      DATA_KEYS: Object.keys(data),
      ROW_COUNTS: rowCounts
    }, null, 2)
  );
}

ReactDOM.createRoot(
  document.getElementById("root")
).render(
  React.createElement(
    SigmaClientProvider,
    { client: client },
    React.createElement(App)
  )
);
</script>

</body>
</html>
