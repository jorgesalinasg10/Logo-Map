<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script crossorigin
    src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>

  <script crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>

  <script
    src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js">
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: white;
    }

    #chart {

    .tick {

    }

    .title {

    }

    .avg-line {

    }

    }
  </style>
</head>

<body>

<div id="chart">
  <div class="message">
    Loading Sigma data...
  </div>
</div>

<div id="tooltip"></div>

<script>

const client =
  window.SigmaPlugin.client;


/*
  ----------------------------------------
  SIGMA PROPERTIES
  ----------------------------------------
*/

client.config.configureEditorPanel([
  {
    name: "source",
    type: "element",
    label: "Data Source"
  },
  {
    name: "score",
    type: "column",
    source: "source",
    label: "Deal Score",
    allowMultiple: false
  },
  {
    name: "revenue",
    type: "column",
    source: "source",
    label: "AAV Net",
    allowMultiple: false
  },
  {
    name: "company",
    type: "column",
    source: "source",
    label: "Company Name",
    allowMultiple: false
  },
  {
    name: "logo",
    type: "column",
    source: "source",
    label: "Logo URL",
    allowMultiple: false
  }
]);


/*
  ----------------------------------------
  GENERAL SETTINGS
  ----------------------------------------
*/

const LOGO_SIZE = 90;

/*
  Increase this if you want logos
  spread farther apart.
*/

const COLLISION_DISTANCE = 78;

/*
  Maximum distance a logo may move
  away from its real data position.
*/

const MAX_DISPLACEMENT = 78;

const COLLISION_ITERATIONS = 60;


/*
  ----------------------------------------
  STATE
  ----------------------------------------
*/

let config =
  client.config.get() || {};

let data = {};

let currentSource = null;

let stopData = null;


/*
  ----------------------------------------
  LOGO CACHE
  ----------------------------------------
*/

const normalizedLogoCache =
  new Map();

const logosBeingProcessed =
  new Set();


/*
  ----------------------------------------
  HELPERS
  ----------------------------------------
*/

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}


function numeric(value) {

  if (
    typeof value === "number"
  ) {

    return Number.isFinite(value)
      ? value
      : null;
  }

  if (
    value === null ||
    value === undefined
  ) {

    return null;
  }

  const n =
    Number(
      String(value)
        .replace(/[$,%]/g, "")
        .trim()
    );

  return Number.isFinite(n)
    ? n
    : null;
}


function formatMoney(value) {

  return new Intl.NumberFormat(
    "en-US",
    {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 0
    }
  ).format(value);
}


/*
  ========================================
  AUTOMATIC LOGO NORMALIZATION
  ========================================

  This:

  1. Loads each image
  2. Detects transparent / solid background
  3. Finds the visible logo
  4. Crops excess space
  5. Centers the visible logo
  6. Makes logos feel much closer in size
  7. Preserves proportions
*/


function normalizeLogo(url) {

  if (
    normalizedLogoCache.has(url) ||
    logosBeingProcessed.has(url)
  ) {

    return;
  }


  logosBeingProcessed.add(url);


  const img =
    new Image();


  img.crossOrigin =
    "anonymous";


  img.onload =
    function() {

      try {

        /*
          Avoid processing extremely
          large source images.
        */

        const maxProcessSize =
          1000;


        let processWidth =
          img.naturalWidth;


        let processHeight =
          img.naturalHeight;


        if (
          processWidth > maxProcessSize ||
          processHeight > maxProcessSize
        ) {

          const scale =
            Math.min(
              maxProcessSize /
              processWidth,

              maxProcessSize /
              processHeight
            );


          processWidth =
            Math.round(
              processWidth *
              scale
            );


          processHeight =
            Math.round(
              processHeight *
              scale
            );
        }


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          processWidth;


        canvas.height =
          processHeight;


        const ctx =
          canvas.getContext(
            "2d",
            {
              willReadFrequently: true
            }
          );


        ctx.drawImage(
          img,
          0,
          0,
          processWidth,
          processHeight
        );


        const imageData =
          ctx.getImageData(
            0,
            0,
            processWidth,
            processHeight
          );


        const pixels =
          imageData.data;


/*
  Read one pixel.
*/

        function getPixel(
          x,
          y
        ) {

          const index =
            (
              y *
              processWidth +
              x
            ) *
            4;


          return {

            r:
              pixels[index],

            g:
              pixels[
                index + 1
              ],

            b:
              pixels[
                index + 2
              ],

            a:
              pixels[
                index + 3
              ]
          };
        }


/*
  Sample the corners to estimate
  the image background.
*/

        const corners = [

          getPixel(
            0,
            0
          ),

          getPixel(
            processWidth - 1,
            0
          ),

          getPixel(
            0,
            processHeight - 1
          ),

          getPixel(
            processWidth - 1,
            processHeight - 1
          )
        ];


        const averageCornerAlpha =
          corners.reduce(
            (
              sum,
              pixel
            ) =>
              sum +
              pixel.a,
            0
          ) /
          corners.length;


        const backgroundTransparent =
          averageCornerAlpha < 50;


        const backgroundColor = {

          r:
            corners.reduce(
              (
                sum,
                pixel
              ) =>
                sum +
                pixel.r,
              0
            ) /
            corners.length,

          g:
            corners.reduce(
              (
                sum,
                pixel
              ) =>
                sum +
                pixel.g,
              0
            ) /
            corners.length,

          b:
            corners.reduce(
              (
                sum,
                pixel
              ) =>
                sum +
                pixel.b,
              0
            ) /
            corners.length
        };


        let minX =
          processWidth;

        let minY =
          processHeight;

        let maxX =
          -1;

        let maxY =
          -1;


/*
  Determine whether a pixel
  belongs to the visible logo.
*/

        function isVisiblePixel(
          r,
          g,
          b,
          a
        ) {

          /*
            Ignore transparent pixels.
          */

          if (
            a < 20
          ) {

            return false;
          }


          /*
            Transparent PNG.
          */

          if (
            backgroundTransparent
          ) {

            return true;
          }


          /*
            Compare pixel to estimated
            background color.
          */

          const dr =
            r -
            backgroundColor.r;


          const dg =
            g -
            backgroundColor.g;


          const db =
            b -
            backgroundColor.b;


          const distance =
            Math.sqrt(
              dr * dr +
              dg * dg +
              db * db
            );


          return distance > 28;
        }


/*
  Scan the image and find
  visible logo boundaries.
*/

        for (
          let y = 0;
          y < processHeight;
          y++
        ) {

          for (
            let x = 0;
            x < processWidth;
            x++
          ) {

            const index =
              (
                y *
                processWidth +
                x
              ) *
              4;


            const r =
              pixels[index];


            const g =
              pixels[
                index + 1
              ];


            const b =
              pixels[
                index + 2
              ];


            const a =
              pixels[
                index + 3
              ];


            if (
              isVisiblePixel(
                r,
                g,
                b,
                a
              )
            ) {

              if (
                x < minX
              ) {
                minX = x;
              }


              if (
                x > maxX
              ) {
                maxX = x;
              }


              if (
                y < minY
              ) {
                minY = y;
              }


              if (
                y > maxY
              ) {
                maxY = y;
              }
            }
          }
        }


/*
  If detection fails,
  just use the source image.
*/

        if (
          maxX < minX ||
          maxY < minY
        ) {

          normalizedLogoCache.set(
            url,
            url
          );


          logosBeingProcessed.delete(
            url
          );


          render();


          return;
        }


        let cropWidth =
          maxX -
          minX +
          1;


        let cropHeight =
          maxY -
          minY +
          1;


/*
  Small safety padding
  around the visible logo.
*/

        const paddingX =
          Math.round(
            cropWidth *
            0.025
          );


        const paddingY =
          Math.round(
            cropHeight *
            0.025
          );


        minX =
          Math.max(
            0,
            minX -
            paddingX
          );


        minY =
          Math.max(
            0,
            minY -
            paddingY
          );


        maxX =
          Math.min(
            processWidth - 1,
            maxX +
            paddingX
          );


        maxY =
          Math.min(
            processHeight - 1,
            maxY +
            paddingY
          );


        cropWidth =
          maxX -
          minX +
          1;


        cropHeight =
          maxY -
          minY +
          1;


/*
  All logos are normalized
  onto a 500 × 500 canvas.
*/

        const outputSize =
          500;


        const outputCanvas =
          document.createElement(
            "canvas"
          );


        outputCanvas.width =
          outputSize;


        outputCanvas.height =
          outputSize;


        const outputContext =
          outputCanvas.getContext(
            "2d"
          );


/*
  ----------------------------------------
  STRONG VISUAL SIZE NORMALIZATION
  ----------------------------------------
*/

        const aspectRatio =
          cropWidth /
          cropHeight;


/*
  Normal logos fill about 92%
  of the normalization canvas.
*/

        let targetSize =
          outputSize *
          0.92;


/*
  Very wide or very tall logos
  get a little extra boost.

  This helps wordmarks like
  AdventHealth feel closer in size
  to compact / square logos.
*/

        if (
          aspectRatio > 2.2 ||
          aspectRatio < 0.45
        ) {

          targetSize =
            outputSize *
            0.98;
        }


/*
  Preserve the original proportions.
*/

        const fitScale =
          Math.min(
            targetSize /
            cropWidth,

            targetSize /
            cropHeight
          );


        let drawWidth =
          cropWidth *
          fitScale;


        let drawHeight =
          cropHeight *
          fitScale;


/*
  Safety cap.
*/

        const maxVisibleSize =
          outputSize *
          0.98;


        if (
          drawWidth >
          maxVisibleSize
        ) {

          const correction =
            maxVisibleSize /
            drawWidth;


          drawWidth *=
            correction;


          drawHeight *=
            correction;
        }


        if (
          drawHeight >
          maxVisibleSize
        ) {

          const correction =
            maxVisibleSize /
            drawHeight;


          drawWidth *=
            correction;


          drawHeight *=
            correction;
        }


/*
  Center the visible logo.
*/

        const drawX =
          (
            outputSize -
            drawWidth
          ) /
          2;


        const drawY =
          (
            outputSize -
            drawHeight
          ) /
          2;


        outputContext.clearRect(
          0,
          0,
          outputSize,
          outputSize
        );


        outputContext.drawImage(
          canvas,

          minX,
          minY,
          cropWidth,
          cropHeight,

          drawX,
          drawY,
          drawWidth,
          drawHeight
        );


        const normalizedUrl =
          outputCanvas.toDataURL(
            "image/png"
          );


        normalizedLogoCache.set(
          url,
          normalizedUrl
        );


        logosBeingProcessed.delete(
          url
        );


        render();
      }

      catch (
        error
      ) {

        normalizedLogoCache.set(
          url,
          url
        );


        logosBeingProcessed.delete(
          url
        );


        render();
      }
    };


  img.onerror =
    function() {

      normalizedLogoCache.set(
        url,
        url
      );


      logosBeingProcessed.delete(
        url
      );


      render();
    };


  img.src =
    url;
}


/*
  Return normalized image if ready.

  Otherwise temporarily use the
  original while processing.
*/

function getLogoUrl(url) {

  if (
    normalizedLogoCache.has(
      url
    )
  ) {

    return normalizedLogoCache.get(
      url
    );
  }


  normalizeLogo(
    url
  );


  return url;
}


/*
  ========================================
  AUTOMATIC COLLISION SPREADING
  ========================================

  actualX / actualY
  = true data position

  displayX / displayY
  = where the logo is shown
*/


function spreadLogos(
  points,
  plotLeft,
  plotTop,
  plotRight,
  plotBottom
) {

  const logoPoints =
    points.filter(
      point =>
        point.hasLogo
    );


/*
  Start logos at their
  true positions.
*/

  logoPoints.forEach(
    point => {

      point.displayX =
        point.actualX;


      point.displayY =
        point.actualY;
    }
  );


/*
  Multiple passes gently
  separate overlapping logos.
*/

  for (
    let iteration = 0;
    iteration <
    COLLISION_ITERATIONS;
    iteration++
  ) {

    for (
      let i = 0;
      i <
      logoPoints.length;
      i++
    ) {

      for (
        let j = i + 1;
        j <
        logoPoints.length;
        j++
      ) {

        const a =
          logoPoints[i];


        const b =
          logoPoints[j];


        let dx =
          b.displayX -
          a.displayX;


        let dy =
          b.displayY -
          a.displayY;


        let distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


/*
  If two points are exactly
  on top of each other,
  give them a deterministic
  direction to separate.
*/

        if (
          distance < 0.01
        ) {

          const seed =
            (
              (
                i + 1
              ) *
              37 +

              (
                j + 1
              ) *
              53
            ) %
            360;


          const angle =
            seed *
            Math.PI /
            180;


          dx =
            Math.cos(
              angle
            );


          dy =
            Math.sin(
              angle
            );


          distance =
            1;
        }


        if (
          distance <
          COLLISION_DISTANCE
        ) {

          const overlap =
            COLLISION_DISTANCE -
            distance;


          const push =
            overlap *
            0.40;


          const nx =
            dx /
            distance;


          const ny =
            dy /
            distance;


          a.displayX -=
            nx *
            push;


          a.displayY -=
            ny *
            push;


          b.displayX +=
            nx *
            push;


          b.displayY +=
            ny *
            push;
        }
      }
    }


/*
  Gently pull logos back toward
  their true data position.
*/

    logoPoints.forEach(
      point => {

        point.displayX +=
          (
            point.actualX -
            point.displayX
          ) *
          0.03;


        point.displayY +=
          (
            point.actualY -
            point.displayY
          ) *
          0.03;


/*
  Limit how far a logo
  can move.
*/

        let dx =
          point.displayX -
          point.actualX;


        let dy =
          point.displayY -
          point.actualY;


        const displacement =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        if (
          displacement >
          MAX_DISPLACEMENT
        ) {

          const scale =
            MAX_DISPLACEMENT /
            displacement;


          point.displayX =
            point.actualX +
            dx *
            scale;


          point.displayY =
            point.actualY +
            dy *
            scale;
        }


/*
  Keep logos inside
  the plot area.
*/

        const halfLogo =
          LOGO_SIZE /
          2;


        point.displayX =
          Math.max(
            plotLeft +
            halfLogo,

            Math.min(
              plotRight -
              halfLogo,

              point.displayX
            )
          );


        point.displayY =
          Math.max(
            plotTop +
            halfLogo,

            Math.min(
              plotBottom -
              halfLogo,

              point.displayY
            )
          );
      }
    );
  }
}


/*
  ========================================
  SIGMA DATA CONNECTION
  ========================================
*/


function connectData() {

  if (
    !config.source
  ) {

    return;
  }


  if (
    config.source ===
    currentSource
  ) {

    render();

    return;
  }


  currentSource =
    config.source;


  if (
    stopData
  ) {

    stopData();
  }


  stopData =
    client.elements.subscribeToElementData(
      config.source,

      function(
        nextData
      ) {

        data =
          nextData ||
          {};


        render();
      }
    );
}


/*
  ========================================
  MAIN RENDER
  ========================================
*/


function render() {

  const container =
    document.getElementById(
      "chart"
    );


  if (
    !config.score ||
    !config.revenue
  ) {

    container.innerHTML =
      '<div class="message">Select Deal Score and AAV Net.</div>';

    return;
  }


  const scores =
    data[
      config.score
    ] ||
    [];


  const revenues =
    data[
      config.revenue
    ] ||
    [];


  const companies =
    config.company
      ?
      data[
        config.company
      ] ||
      []
      :
      [];


  const logos =
    config.logo
      ?
      data[
        config.logo
      ] ||
      []
      :
      [];


/*
  Logo Mode is active whenever
  the Logo URL column contains
  valid image URLs.

  Your Sigma dropdown makes
  these URLs null in Dot mode.
*/

  const logoMode =
    logos.some(
      logo =>
        logo &&
        /^https?:\/\//i.test(
          String(
            logo
          )
        )
    );


/*
  Background colors.
*/

  const backgroundColor =
    logoMode
      ?
      "#EEF0F2"
      :
      "#FFFFFF";


  container.style.background =
    backgroundColor;


  document.body.style.background =
    backgroundColor;


  document.documentElement.style.background =
    backgroundColor;


  if (
    !scores.length ||
    !revenues.length
  ) {

    container.innerHTML =
      '<div class="message">Waiting for Sigma data...</div>';

    return;
  }


  const rowCount =
    Math.min(
      scores.length,
      revenues.length
    );


  const points =
    [];


  for (
    let i = 0;
    i <
    rowCount;
    i++
  ) {

    const x =
      numeric(
        scores[i]
      );


    const y =
      numeric(
        revenues[i]
      );


    if (
      x === null ||
      y === null
    ) {

      continue;
    }


    const logo =
      logos[i] ||
      "";


    points.push({

      x:
        x,

      y:
        y,

      company:
        companies[i] ||
        "",

      logo:
        logo,

      hasLogo:
        Boolean(
          logo &&
          /^https?:\/\//i.test(
            String(
              logo
            )
          )
        )
    });
  }


  if (
    !points.length
  ) {

    container.innerHTML =
      '<div class="message">No valid rows found.</div>';

    return;
  }


/*
  ----------------------------------------
  CHART SIZE
  ----------------------------------------
*/

  const width =
    1000;


  const height =
    560;


  const margin = {

    top:
      50,

    right:
      45,

    bottom:
      65,

    left:
      95
  };


  const plotWidth =
    width -
    margin.left -
    margin.right;


  const plotHeight =
    height -
    margin.top -
    margin.bottom;


  const xs =
    points.map(
      point =>
        point.x
    );


  const ys =
    points.map(
      point =>
        point.y
    );


  const scoreIsDecimal =
    Math.max(
      ...xs
    ) <=
    1.5;


  let minX =
    Math.min(
      ...xs
    );


  let maxX =
    Math.max(
      ...xs
    );


  let maxY =
    Math.max(
      ...ys
    );


  const xPadding =
    Math.max(
      (
        maxX -
        minX
      ) *
      0.07,

      scoreIsDecimal
        ?
        0.01
        :
        1
    );


  minX -=
    xPadding;


  maxX +=
    xPadding;


  if (
    scoreIsDecimal
  ) {

    minX =
      Math.max(
        0,
        minX
      );


    maxX =
      Math.min(
        1,
        maxX
      );
  }


  maxY *=
    1.08;


/*
  ----------------------------------------
  SCALES
  ----------------------------------------
*/


  function sx(
    value
  ) {

    return (
      margin.left +
      (
        (
          value -
          minX
        ) /
        (
          maxX -
          minX ||
          1
        )
      ) *
      plotWidth
    );
  }


  function sy(
    value
  ) {

    return (
      margin.top +
      plotHeight -
      (
        value /
        maxY
      ) *
      plotHeight
    );
  }


  function formatScore(
    value
  ) {

    if (
      scoreIsDecimal
    ) {

      return (
        value *
        100
      ).toFixed(
        0
      ) +
      "%";
    }


    return value.toFixed(
      0
    ) +
    "%";
  }


/*
  ----------------------------------------
  AVERAGES
  ----------------------------------------
*/


  const avgX =
    xs.reduce(
      (
        sum,
        value
      ) =>
        sum +
        value,
      0
    ) /
    xs.length;


  const avgY =
    ys.reduce(
      (
        sum,
        value
      ) =>
        sum +
        value,
      0
    ) /
    ys.length;


/*
  Calculate true positions.
*/

  points.forEach(
    point => {

      point.actualX =
        sx(
          point.x
        );


      point.actualY =
        sy(
          point.y
        );


      point.displayX =
        point.actualX;


      point.displayY =
        point.actualY;
    }
  );


/*
  Only spread positions
  when Logo mode is active.
*/

  if (
    logoMode
  ) {

    spreadLogos(
      points,

      margin.left,

      margin.top,

      width -
      margin.right,

      height -
      margin.bottom
    );
  }


/*
  ========================================
  BUILD SVG
  ========================================
*/


  let svg =
    `
    <svg
      viewBox="0 0 ${width} ${height}"
    >

      <rect
        x="0"
        y="0"
        width="${width}"
        height="${height}"
        fill="${backgroundColor}"
      />
    `;


/*
  Title
*/

  svg +=
    `
    <text
      class="title"
      x="18"
      y="25"
    >
      Deal Score Plot in Relation to Revenue
    </text>
    `;


/*
  ----------------------------------------
  Y GRID
  ----------------------------------------
*/


  const ySteps =
    8;


  for (
    let i = 0;
    i <=
    ySteps;
    i++
  ) {

    const value =
      maxY *
      i /
      ySteps;


    const y =
      sy(
        value
      );


    svg +=
      `
      <line
        class="grid"
        x1="${margin.left}"
        y1="${y}"
        x2="${width - margin.right}"
        y2="${y}"
      />

      <text
        class="tick"
        x="${margin.left - 10}"
        y="${y + 4}"
        text-anchor="end"
      >
        ${formatMoney(value)}
      </text>
      `;
  }


/*
  ----------------------------------------
  X GRID
  ----------------------------------------
*/


  const xSteps =
    8;


  for (
    let i = 0;
    i <=
    xSteps;
    i++
  ) {

    const value =
      minX +
      (
        (
          maxX -
          minX
        ) *
        i /
        xSteps
      );


    const x =
      sx(
        value
      );


    svg +=
      `
      <line
        class="grid"
        x1="${x}"
        y1="${margin.top}"
        x2="${x}"
        y2="${height - margin.bottom}"
      />

      <text
        class="tick"
        x="${x}"
        y="${height - margin.bottom + 22}"
        text-anchor="middle"
      >
        ${formatScore(value)}
      </text>
      `;
  }


/*
  Axes
*/

  svg +=
    `
    <line
      class="axis"
      x1="${margin.left}"
      y1="${height - margin.bottom}"
      x2="${width - margin.right}"
      y2="${height - margin.bottom}"
    />

    <line
      class="axis"
      x1="${margin.left}"
      y1="${margin.top}"
      x2="${margin.left}"
      y2="${height - margin.bottom}"
    />
    `;


/*
  ----------------------------------------
  AVERAGE LINES
  ----------------------------------------
*/


  svg +=
    `
    <line
      class="avg-line"
      x1="${sx(avgX)}"
      y1="${margin.top}"
      x2="${sx(avgX)}"
      y2="${height - margin.bottom}"
    />

    <text
      class="avg-label"
      x="${sx(avgX) + 5}"
      y="${margin.top + 13}"
    >
      Avg Deal Score
    </text>

    <line
      class="avg-line"
      x1="${margin.left}"
      y1="${sy(avgY)}"
      x2="${width - margin.right}"
      y2="${sy(avgY)}"
    />

    <text
      class="avg-label"
      x="${width - margin.right - 5}"
      y="${sy(avgY) - 6}"
      text-anchor="end"
    >
      Avg AAV Net
    </text>
    `;


/*
  Axis titles
*/

  svg +=
    `
    <text
      class="axis-title"
      x="${margin.left + plotWidth / 2}"
      y="${height - 15}"
      text-anchor="middle"
    >
      Deal Score
    </text>

    <text
      class="axis-title"
      transform="translate(
        22
        ${margin.top + plotHeight / 2}
      ) rotate(-90)"
      text-anchor="middle"
    >
      AAV Net
    </text>
    `;


/*
  ========================================
  CONNECTOR LINES
  ========================================
*/


  points.forEach(
    point => {

      if (
        !point.hasLogo
      ) {

        return;
      }


      const dx =
        point.displayX -
        point.actualX;


      const dy =
        point.displayY -
        point.actualY;


      const movedDistance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if (
        movedDistance >
        7
      ) {

        svg +=
          `
          <line
            class="connector"
            x1="${point.actualX}"
            y1="${point.actualY}"
            x2="${point.displayX}"
            y2="${point.displayY}"
          />
          `;
      }
    }
  );


/*
  ========================================
  LOGOS + DOTS
  ========================================
*/


  points.forEach(
    function(
      point,
      index
    ) {

      svg +=
        `
        <g
          class="point"
          data-index="${index}"
        >
        `;


      if (
        point.hasLogo
      ) {

        const displayLogo =
          getLogoUrl(
            point.logo
          );


        svg +=
          `
          <image
            class="logo"
            x="${point.displayX - LOGO_SIZE / 2}"
            y="${point.displayY - LOGO_SIZE / 2}"
            width="${LOGO_SIZE}"
            height="${LOGO_SIZE}"
            href="${escapeHtml(displayLogo)}"
            preserveAspectRatio="xMidYMid meet"
          />
          `;
      }

      else {

        svg +=
          `
          <circle
            class="dot"
            cx="${point.actualX}"
            cy="${point.actualY}"
            r="6"
          />
          `;
      }


      svg +=
        `
        </g>
        `;
    }
  );


  svg +=
    `
    </svg>
    `;


  container.innerHTML =
    svg;


/*
  ========================================
  TOOLTIPS
  ========================================
*/


  const tooltip =
    document.getElementById(
      "tooltip"
    );


  container
    .querySelectorAll(
      ".point"
    )
    .forEach(
      function(
        element
      ) {

        const point =
          points[
            Number(
              element.dataset.index
            )
          ];


        element.addEventListener(
          "mousemove",

          function(
            event
          ) {

            tooltip.innerHTML =
              `
              <strong>
                ${escapeHtml(
                  point.company ||
                  "Company"
                )}
              </strong>

              <br>

              Deal Score:
              ${formatScore(
                point.x
              )}

              <br>

              AAV Net:
              ${formatMoney(
                point.y
              )}
              `;


            tooltip.style.display =
              "block";


            tooltip.style.left =
              event.clientX +
              12 +
              "px";


            tooltip.style.top =
              event.clientY +
              12 +
              "px";
          }
        );


        element.addEventListener(
          "mouseleave",

          function() {

            tooltip.style.display =
              "none";
          }
        );
      }
    );
}


/*
  ========================================
  START
  ========================================
*/


client.config.subscribe(
  function(
    nextConfig
  ) {

    config =
      nextConfig ||
      {};


    connectData();


    render();
  }
);


config =
  client.config.get() ||
  {};


connectData();

</script>

</body>
</html>
