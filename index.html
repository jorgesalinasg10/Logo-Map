<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }
  </style>
</head>

<body>

<div id="app">
  Logo Scatter Plot ready. Select your data fields in Properties.
</div>

<script>
  const client = SigmaPlugin.initialize();

  client.config.configureEditorPanel([
    {
      name: "Data Source",
      type: "element"
    },
    {
      name: "Deal Score",
      type: "column",
      source: "Data Source",
      allowMultiple: false
    },
    {
      name: "AAV Net",
      type: "column",
      source: "Data Source",
      allowMultiple: false
    },
    {
      name: "Company Name",
      type: "column",
      source: "Data Source",
      allowMultiple: false
    },
    {
      name: "Logo URL",
      type: "column",
      source: "Data Source",
      allowMultiple: false
    }
  ]);
</script>

</body>
</html>
