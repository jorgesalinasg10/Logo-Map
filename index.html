<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script crossorigin
    src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>

  <script crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>

  <script
    src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js">
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: white;
    }

    #chart {
      width: 100%;
      height: 100%;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .grid {
      stroke: #dfe2e5;
      stroke-width: 1;
    }

    .axis {
      stroke: #888;
      stroke-width: 1;
    }

    .tick {
      fill: #666;
      font-size: 11px;
    }

    .title {
      fill: #222;
      font-size: 17px;
      font-weight: 600;
    }

    .axis-title {
      fill: #333;
      font-size: 12px;
      font-weight: 600;
    }

    .avg-line {
      stroke: #777;
      stroke-width: 1.3;
      stroke-dasharray: 5 4;
    }

    .avg-label {
      fill: #555;
      font-size: 10px;
    }

    .dot {
      fill: #5b9bd5;
      stroke: white;
      stroke-width: 1.5;
    }

    .logo {
      cursor: pointer;
    }

    .break-line {
      stroke: #8a8a8a;
      stroke-width: 1.2;
      stroke-dasharray: 4 4;
    }

    .break-label {
      fill: #666;
      font-size: 10px;
      font-style: italic;
    }

    #tooltip {
      position: fixed;
      display: none;
      pointer-events: none;
      background: rgba(25, 25, 25, 0.94);
      color: white;
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      z-index: 9999;
    }

    .message {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
    }
  </style>
</head>

<body>

<div id="chart">
  <div class="message">
    Loading Sigma data...
  </div>
</div>

<div id="tooltip"></div>

<script>

const client =
  window.SigmaPlugin.client;


/*
  ========================================
  SIGMA PROPERTIES
  ========================================
*/

client.config.configureEditorPanel([
  {
    name: "source",
    type: "element",
    label: "Data Source"
  },
  {
    name: "score",
    type: "column",
    source: "source",
    label: "Deal Score",
    allowMultiple: false
  },
  {
    name: "revenue",
    type: "column",
    source: "source",
    label: "AAV Net",
    allowMultiple: false
  },
  {
    name: "company",
    type: "column",
    source: "source",
    label: "Company Name",
    allowMultiple: false
  },
  {
    name: "logo",
    type: "column",
    source: "source",
    label: "Logo URL",
    allowMultiple: false
  }
]);


/*
  ========================================
  SETTINGS
  ========================================
*/

const LOGO_SIZE = 90;

const CHART_WIDTH = 2400;
const CHART_HEIGHT = 700;

/*
  Lower AAV section gets most
  of the vertical chart space.
*/

const LOWER_SECTION_SHARE = 0.72;


/*
  ========================================
  STATE
  ========================================
*/

let config =
  client.config.get() || {};

let data = {};

let currentSource = null;

let stopData = null;


/*
  ========================================
  LOGO CACHE
  ========================================
*/

const normalizedLogoCache =
  new Map();

const logosBeingProcessed =
  new Set();


/*
  ========================================
  HELPERS
  ========================================
*/

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}


function numeric(value) {

  if (
    typeof value === "number"
  ) {

    return Number.isFinite(value)
      ? value
      : null;
  }


  if (
    value === null ||
    value === undefined
  ) {

    return null;
  }


  const n =
    Number(
      String(value)
        .replace(/[$,%]/g, "")
        .trim()
    );


  return Number.isFinite(n)
    ? n
    : null;
}


function formatMoney(value) {

  return new Intl.NumberFormat(
    "en-US",
    {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 0
    }
  ).format(value);
}


/*
  ========================================
  AUTOMATIC LOGO NORMALIZATION
  ========================================

  Attempts to:

  - remove excess transparent/white space
  - center the actual visible logo
  - normalize visual area
  - preserve logo proportions
*/

function normalizeLogo(url) {

  if (
    normalizedLogoCache.has(url) ||
    logosBeingProcessed.has(url)
  ) {

    return;
  }


  logosBeingProcessed.add(url);


  const img =
    new Image();


  img.crossOrigin =
    "anonymous";


  img.onload =
    function() {

      try {

        const maxProcessSize =
          1000;


        let processWidth =
          img.naturalWidth;


        let processHeight =
          img.naturalHeight;


        if (
          processWidth > maxProcessSize ||
          processHeight > maxProcessSize
        ) {

          const scale =
            Math.min(
              maxProcessSize / processWidth,
              maxProcessSize / processHeight
            );


          processWidth =
            Math.round(
              processWidth * scale
            );


          processHeight =
            Math.round(
              processHeight * scale
            );
        }


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          processWidth;


        canvas.height =
          processHeight;


        const ctx =
          canvas.getContext(
            "2d",
            {
              willReadFrequently: true
            }
          );


        ctx.drawImage(
          img,
          0,
          0,
          processWidth,
          processHeight
        );


        const imageData =
          ctx.getImageData(
            0,
            0,
            processWidth,
            processHeight
          );


        const pixels =
          imageData.data;


        function getPixel(
          x,
          y
        ) {

          const index =
            (
              y *
              processWidth +
              x
            ) *
            4;


          return {

            r:
              pixels[index],

            g:
              pixels[index + 1],

            b:
              pixels[index + 2],

            a:
              pixels[index + 3]
          };
        }


        const corners = [

          getPixel(
            0,
            0
          ),

          getPixel(
            processWidth - 1,
            0
          ),

          getPixel(
            0,
            processHeight - 1
          ),

          getPixel(
            processWidth - 1,
            processHeight - 1
          )
        ];


        const averageCornerAlpha =
          corners.reduce(
            (
              sum,
              pixel
            ) =>
              sum +
              pixel.a,
            0
          ) /
          corners.length;


        const backgroundTransparent =
          averageCornerAlpha < 50;


        const backgroundColor = {

          r:
            corners.reduce(
              (
                sum,
                pixel
              ) =>
                sum +
                pixel.r,
              0
            ) /
            corners.length,

          g:
            corners.reduce(
              (
                sum,
                pixel
              ) =>
                sum +
                pixel.g,
              0
            ) /
            corners.length,

          b:
            corners.reduce(
              (
                sum,
                pixel
              ) =>
                sum +
                pixel.b,
              0
            ) /
            corners.length
        };


        let minX =
          processWidth;

        let minY =
          processHeight;

        let maxX =
          -1;

        let maxY =
          -1;


        function isVisiblePixel(
          r,
          g,
          b,
          a
        ) {

          if (
            a < 20
          ) {

            return false;
          }


          if (
            backgroundTransparent
          ) {

            return true;
          }


          const dr =
            r -
            backgroundColor.r;


          const dg =
            g -
            backgroundColor.g;


          const db =
            b -
            backgroundColor.b;


          const distance =
            Math.sqrt(
              dr * dr +
              dg * dg +
              db * db
            );


          return distance > 28;
        }


        for (
          let y = 0;
          y < processHeight;
          y++
        ) {

          for (
            let x = 0;
            x < processWidth;
            x++
          ) {

            const index =
              (
                y *
                processWidth +
                x
              ) *
              4;


            const r =
              pixels[index];


            const g =
              pixels[index + 1];


            const b =
              pixels[index + 2];


            const a =
              pixels[index + 3];


            if (
              isVisiblePixel(
                r,
                g,
                b,
                a
              )
            ) {

              if (
                x < minX
              ) {
                minX = x;
              }


              if (
                x > maxX
              ) {
                maxX = x;
              }


              if (
                y < minY
              ) {
                minY = y;
              }


              if (
                y > maxY
              ) {
                maxY = y;
              }
            }
          }
        }


        if (
          maxX < minX ||
          maxY < minY
        ) {

          normalizedLogoCache.set(
            url,
            url
          );


          logosBeingProcessed.delete(
            url
          );


          render();


          return;
        }


        let cropWidth =
          maxX -
          minX +
          1;


        let cropHeight =
          maxY -
          minY +
          1;


        const paddingX =
          Math.round(
            cropWidth *
            0.02
          );


        const paddingY =
          Math.round(
            cropHeight *
            0.02
          );


        minX =
          Math.max(
            0,
            minX -
            paddingX
          );


        minY =
          Math.max(
            0,
            minY -
            paddingY
          );


        maxX =
          Math.min(
            processWidth -
            1,

            maxX +
            paddingX
          );


        maxY =
          Math.min(
            processHeight -
            1,

            maxY +
            paddingY
          );


        cropWidth =
          maxX -
          minX +
          1;


        cropHeight =
          maxY -
          minY +
          1;


        const outputSize =
          500;


        const outputCanvas =
          document.createElement(
            "canvas"
          );


        outputCanvas.width =
          outputSize;


        outputCanvas.height =
          outputSize;


        const outputContext =
          outputCanvas.getContext(
            "2d"
          );


        /*
          ========================================
          VISUAL AREA NORMALIZATION
          ========================================
        */

        const aspectRatio =
          cropWidth /
          cropHeight;


        const targetArea =
          outputSize *
          outputSize *
          0.28;


        let drawWidth =
          Math.sqrt(
            targetArea *
            aspectRatio
          );


        let drawHeight =
          Math.sqrt(
            targetArea /
            aspectRatio
          );


        const maxDimension =
          outputSize *
          0.98;


        if (
          drawWidth >
          maxDimension
        ) {

          const correction =
            maxDimension /
            drawWidth;


          drawWidth *=
            correction;


          drawHeight *=
            correction;
        }


        if (
          drawHeight >
          maxDimension
        ) {

          const correction =
            maxDimension /
            drawHeight;


          drawWidth *=
            correction;


          drawHeight *=
            correction;
        }


        const drawX =
          (
            outputSize -
            drawWidth
          ) /
          2;


        const drawY =
          (
            outputSize -
            drawHeight
          ) /
          2;


        outputContext.clearRect(
          0,
          0,
          outputSize,
          outputSize
        );


        outputContext.drawImage(
          canvas,

          minX,
          minY,
          cropWidth,
          cropHeight,

          drawX,
          drawY,
          drawWidth,
          drawHeight
        );


        const normalizedUrl =
          outputCanvas.toDataURL(
            "image/png"
          );


        normalizedLogoCache.set(
          url,
          normalizedUrl
        );


        logosBeingProcessed.delete(
          url
        );


        render();
      }

      catch (
        error
      ) {

        normalizedLogoCache.set(
          url,
          url
        );


        logosBeingProcessed.delete(
          url
        );


        render();
      }
    };


  img.onerror =
    function() {

      normalizedLogoCache.set(
        url,
        url
      );


      logosBeingProcessed.delete(
        url
      );


      render();
    };


  img.src =
    url;
}


function getLogoUrl(
  url
) {

  if (
    normalizedLogoCache.has(
      url
    )
  ) {

    return normalizedLogoCache.get(
      url
    );
  }


  normalizeLogo(
    url
  );


  return url;
}


/*
  ========================================
  SIGMA CONNECTION
  ========================================
*/

function connectData() {

  if (
    !config.source
  ) {

    return;
  }


  if (
    config.source ===
    currentSource
  ) {

    render();

    return;
  }


  currentSource =
    config.source;


  if (
    stopData
  ) {

    stopData();
  }


  stopData =
    client.elements.subscribeToElementData(
      config.source,

      function(
        nextData
      ) {

        data =
          nextData ||
          {};


        render();
      }
    );
}


/*
  ========================================
  MAIN RENDER
  ========================================
*/

function render() {

  const container =
    document.getElementById(
      "chart"
    );


  if (
    !config.score ||
    !config.revenue
  ) {

    container.innerHTML =
      '<div class="message">Select Deal Score and AAV Net.</div>';

    return;
  }


  const scores =
    data[
      config.score
    ] ||
    [];


  const revenues =
    data[
      config.revenue
    ] ||
    [];


  const companies =
    config.company
      ?
      data[
        config.company
      ] ||
      []
      :
      [];


  const logos =
    config.logo
      ?
      data[
        config.logo
      ] ||
      []
      :
      [];


  /*
    Logo / dot mode detection.
  */

  const logoMode =
    logos.some(
      logo =>
        logo &&
        /^https?:\/\//i.test(
          String(
            logo
          )
        )
    );


  /*
    Logo mode background.
  */

  const backgroundColor =
    logoMode
      ?
      "#EEF0F2"
      :
      "#FFFFFF";


  container.style.background =
    backgroundColor;


  document.body.style.background =
    backgroundColor;


  document.documentElement.style.background =
    backgroundColor;


  if (
    !scores.length ||
    !revenues.length
  ) {

    container.innerHTML =
      '<div class="message">Waiting for Sigma data...</div>';

    return;
  }


  const rowCount =
    Math.min(
      scores.length,
      revenues.length
    );


  const points =
    [];


  for (
    let i = 0;
    i <
    rowCount;
    i++
  ) {

    const x =
      numeric(
        scores[i]
      );


    const y =
      numeric(
        revenues[i]
      );


    if (
      x === null ||
      y === null
    ) {

      continue;
    }


    const logo =
      logos[i] ||
      "";


    points.push({

      x:
        x,

      y:
        y,

      company:
        companies[i] ||
        "",

      logo:
        logo,

      hasLogo:
        Boolean(
          logo &&
          /^https?:\/\//i.test(
            String(
              logo
            )
          )
        )
    });
  }


  if (
    !points.length
  ) {

    container.innerHTML =
      '<div class="message">No valid rows found.</div>';

    return;
  }


  /*
    ========================================
    CHART DIMENSIONS
    ========================================
  */

  const width =
    CHART_WIDTH;


  const height =
    CHART_HEIGHT;


  const margin = {

    top:
      55,

    right:
      90,

    bottom:
      80,

    left:
      120
  };


  const plotWidth =
    width -
    margin.left -
    margin.right;


  const plotHeight =
    height -
    margin.top -
    margin.bottom;


  const plotBottom =
    height -
    margin.bottom;


  /*
    ========================================
    DATA RANGES
    ========================================
  */

  const xs =
    points.map(
      point =>
        point.x
    );


  const ys =
    points.map(
      point =>
        point.y
    );


  const scoreIsDecimal =
    Math.max(
      ...xs
    ) <=
    1.5;


  let minX =
    Math.min(
      ...xs
    );


  let maxX =
    Math.max(
      ...xs
    );


  const actualMaxY =
    Math.max(
      ...ys
    );


  /*
    ========================================
    X SCALE
    ========================================
  */

  const xPadding =
    Math.max(
      (
        maxX -
        minX
      ) *
      0.05,

      scoreIsDecimal
        ?
        0.01
        :
        1
    );


  minX -=
    xPadding;


  maxX +=
    xPadding;


  if (
    scoreIsDecimal
  ) {

    minX =
      Math.max(
        0,
        minX
      );


    maxX =
      Math.min(
        1,
        maxX
      );
  }


  function sx(
    value
  ) {

    return (
      margin.left +
      (
        (
          value -
          minX
        ) /
        (
          maxX -
          minX ||
          1
        )
      ) *
      plotWidth
    );
  }


  function formatScore(
    value
  ) {

    if (
      scoreIsDecimal
    ) {

      return (
        value *
        100
      ).toFixed(
        0
      ) +
      "%";
    }


    return value.toFixed(
      0
    ) +
    "%";
  }


  /*
    ========================================
    COMPRESSED Y SCALE
    ========================================

    Top three AAV values remain visible.

    Lower-value companies receive
    much more vertical space.
  */

  const sortedY =
    [...ys].sort(
      (
        a,
        b
      ) =>
        b -
        a
    );


  const fourthHighest =
    sortedY.length >= 4
      ?
      sortedY[3]
      :
      actualMaxY;


  let compressionCutoff =
    fourthHighest *
    1.15;


  compressionCutoff =
    Math.min(
      compressionCutoff,
      actualMaxY *
      0.80
    );


  const useCompressedScale =
    sortedY.length >= 4 &&
    actualMaxY >
    compressionCutoff *
    1.35;


  const maxY =
    actualMaxY *
    1.06;


  const lowerPlotHeight =
    plotHeight *
    LOWER_SECTION_SHARE;


  const upperPlotHeight =
    plotHeight -
    lowerPlotHeight;


  const breakY =
    plotBottom -
    lowerPlotHeight;


  function sy(
    value
  ) {

    /*
      Normal linear fallback.
    */

    if (
      !useCompressedScale
    ) {

      return (
        plotBottom -
        (
          value /
          maxY
        ) *
        plotHeight
      );
    }


    /*
      Lower AAV range.
    */

    if (
      value <=
      compressionCutoff
    ) {

      return (
        plotBottom -
        (
          value /
          compressionCutoff
        ) *
        lowerPlotHeight
      );
    }


    /*
      Compressed upper AAV range.
    */

    const upperFraction =
      (
        value -
        compressionCutoff
      ) /
      (
        maxY -
        compressionCutoff
      );


    return (
      breakY -
      upperFraction *
      upperPlotHeight
    );
  }


  /*
    ========================================
    AVERAGES
    ========================================
  */

  const avgX =
    xs.reduce(
      (
        sum,
        value
      ) =>
        sum +
        value,
      0
    ) /
    xs.length;


  const avgY =
    ys.reduce(
      (
        sum,
        value
      ) =>
        sum +
        value,
      0
    ) /
    ys.length;


  /*
    Exact data positions.
    No jitter / spreading.
  */

  points.forEach(
    point => {

      point.actualX =
        sx(
          point.x
        );


      point.actualY =
        sy(
          point.y
        );
    }
  );


  /*
    ========================================
    BUILD SVG
    ========================================
  */

  let svg =
    `
    <svg
      viewBox="0 0 ${width} ${height}"
    >

      <rect
        x="0"
        y="0"
        width="${width}"
        height="${height}"
        fill="${backgroundColor}"
      />
    `;


  /*
    TITLE
  */

  svg +=
    `
    <text
      class="title"
      x="20"
      y="30"
    >
      Deal Score Plot in Relation to Revenue
    </text>
    `;


  /*
    ========================================
    Y GRID
    ========================================
  */

  if (
    useCompressedScale
  ) {

    const lowerSteps =
      6;


    for (
      let i = 0;
      i <=
      lowerSteps;
      i++
    ) {

      const value =
        compressionCutoff *
        i /
        lowerSteps;


      const y =
        sy(
          value
        );


      svg +=
        `
        <line
          class="grid"
          x1="${margin.left}"
          y1="${y}"
          x2="${width - margin.right}"
          y2="${y}"
        />

        <text
          class="tick"
          x="${margin.left - 12}"
          y="${y + 4}"
          text-anchor="end"
        >
          ${formatMoney(value)}
        </text>
        `;
    }


    const upperSteps =
      3;


    for (
      let i = 1;
      i <=
      upperSteps;
      i++
    ) {

      const value =
        compressionCutoff +
        (
          maxY -
          compressionCutoff
        ) *
        i /
        upperSteps;


      const y =
        sy(
          value
        );


      svg +=
        `
        <line
          class="grid"
          x1="${margin.left}"
          y1="${y}"
          x2="${width - margin.right}"
          y2="${y}"
        />

        <text
          class="tick"
          x="${margin.left - 12}"
          y="${y + 4}"
          text-anchor="end"
        >
          ${formatMoney(value)}
        </text>
        `;
    }


    /*
      Scale-break indicator.
    */

    svg +=
      `
      <line
        class="break-line"
        x1="${margin.left}"
        y1="${breakY}"
        x2="${width - margin.right}"
        y2="${breakY}"
      />

      <path
        d="
          M ${margin.left - 7} ${breakY - 5}
          L ${margin.left + 2} ${breakY + 5}
          L ${margin.left + 11} ${breakY - 5}
        "
        fill="none"
        stroke="#666"
        stroke-width="2"
      />

      <text
        class="break-label"
        x="${margin.left + 18}"
        y="${breakY - 8}"
      >
        Compressed AAV scale above ${formatMoney(compressionCutoff)}
      </text>
      `;
  }

  else {

    const ySteps =
      8;


    for (
      let i = 0;
      i <=
      ySteps;
      i++
    ) {

      const value =
        maxY *
        i /
        ySteps;


      const y =
        sy(
          value
        );


      svg +=
        `
        <line
          class="grid"
          x1="${margin.left}"
          y1="${y}"
          x2="${width - margin.right}"
          y2="${y}"
        />

        <text
          class="tick"
          x="${margin.left - 12}"
          y="${y + 4}"
          text-anchor="end"
        >
          ${formatMoney(value)}
        </text>
        `;
    }
  }


  /*
    ========================================
    X GRID
    ========================================
  */

  const xSteps =
    14;


  for (
    let i = 0;
    i <=
    xSteps;
    i++
  ) {

    const value =
      minX +
      (
        (
          maxX -
          minX
        ) *
        i /
        xSteps
      );


    const x =
      sx(
        value
      );


    svg +=
      `
      <line
        class="grid"
        x1="${x}"
        y1="${margin.top}"
        x2="${x}"
        y2="${height - margin.bottom}"
      />

      <text
        class="tick"
        x="${x}"
        y="${height - margin.bottom + 24}"
        text-anchor="middle"
      >
        ${formatScore(value)}
      </text>
      `;
  }


  /*
    ========================================
    AXES
    ========================================
  */

  svg +=
    `
    <line
      class="axis"
      x1="${margin.left}"
      y1="${height - margin.bottom}"
      x2="${width - margin.right}"
      y2="${height - margin.bottom}"
    />

    <line
      class="axis"
      x1="${margin.left}"
      y1="${margin.top}"
      x2="${margin.left}"
      y2="${height - margin.bottom}"
    />
    `;


  /*
    ========================================
    AVERAGE LINES
    ========================================
  */

  svg +=
    `
    <line
      class="avg-line"
      x1="${sx(avgX)}"
      y1="${margin.top}"
      x2="${sx(avgX)}"
      y2="${height - margin.bottom}"
    />

    <text
      class="avg-label"
      x="${sx(avgX) + 6}"
      y="${margin.top + 14}"
    >
      Avg Deal Score
    </text>

    <line
      class="avg-line"
      x1="${margin.left}"
      y1="${sy(avgY)}"
      x2="${width - margin.right}"
      y2="${sy(avgY)}"
    />

    <text
      class="avg-label"
      x="${width - margin.right - 6}"
      y="${sy(avgY) - 7}"
      text-anchor="end"
    >
      Avg AAV Net
    </text>
    `;


  /*
    ========================================
    AXIS TITLES
    ========================================
  */

  svg +=
    `
    <text
      class="axis-title"
      x="${margin.left + plotWidth / 2}"
      y="${height - 18}"
      text-anchor="middle"
    >
      Deal Score
    </text>

    <text
      class="axis-title"
      transform="translate(
        28
        ${margin.top + plotHeight / 2}
      ) rotate(-90)"
      text-anchor="middle"
    >
      AAV Net
    </text>
    `;


  /*
    ========================================
    LOGOS + DOTS
    ========================================
  */

  points.forEach(
    function(
      point,
      index
    ) {

      svg +=
        `
        <g
          class="point"
          data-index="${index}"
        >
        `;


      if (
        point.hasLogo
      ) {

        const displayLogo =
          getLogoUrl(
            point.logo
          );


        svg +=
          `
          <image
            class="logo"
            x="${point.actualX - LOGO_SIZE / 2}"
            y="${point.actualY - LOGO_SIZE / 2}"
            width="${LOGO_SIZE}"
            height="${LOGO_SIZE}"
            href="${escapeHtml(displayLogo)}"
            preserveAspectRatio="xMidYMid meet"
          />
          `;
      }

      else {

        svg +=
          `
          <circle
            class="dot"
            cx="${point.actualX}"
            cy="${point.actualY}"
            r="6"
          />
          `;
      }


      svg +=
        `
        </g>
        `;
    }
  );


  svg +=
    `
    </svg>
    `;


  container.innerHTML =
    svg;


  /*
    ========================================
    TOOLTIPS
    ========================================
  */

  const tooltip =
    document.getElementById(
      "tooltip"
    );


  container
    .querySelectorAll(
      ".point"
    )
    .forEach(
      function(
        element
      ) {

        const point =
          points[
            Number(
              element.dataset.index
            )
          ];


        element.addEventListener(
          "mousemove",

          function(
            event
          ) {

            tooltip.innerHTML =
              `
              <strong>
                ${escapeHtml(
                  point.company ||
                  "Company"
                )}
              </strong>

              <br>

              Deal Score:
              ${formatScore(
                point.x
              )}

              <br>

              AAV Net:
              ${formatMoney(
                point.y
              )}
              `;


            tooltip.style.display =
              "block";


            tooltip.style.left =
              event.clientX +
              12 +
              "px";


            tooltip.style.top =
              event.clientY +
              12 +
              "px";
          }
        );


        element.addEventListener(
          "mouseleave",

          function() {

            tooltip.style.display =
              "none";
          }
        );
      }
    );
}


/*
  ========================================
  START
  ========================================
*/

client.config.subscribe(
  function(
    nextConfig
  ) {

    config =
      nextConfig ||
      {};


    connectData();


    render();
  }
);


config =
  client.config.get() ||
  {};


connectData();

</script>

</body>
</html>
