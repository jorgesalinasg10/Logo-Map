<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>

<body style="font-family:Arial;padding:20px">

<div id="status">Starting...</div>

<!-- React first -->
<script
  crossorigin
  src="https://unpkg.com/react@18/umd/react.production.min.js">
</script>

<script
  crossorigin
  src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
</script>

<!-- Sigma Plugin SDK -->
<script
  src="https://unpkg.com/@sigmacomputing/plugin@1.2.0/dist/umd/sigmacomputing-plugin.umd.js">
</script>

<script>
const status = document.getElementById("status");

try {

  if (!window.SigmaPlugin) {
    throw new Error("SigmaPlugin did not load");
  }

  if (typeof window.SigmaPlugin.initialize !== "function") {
    throw new Error(
      "initialize still missing. SDK properties: " +
      Object.getOwnPropertyNames(window.SigmaPlugin).join(", ")
    );
  }

  const client = window.SigmaPlugin.initialize();

  client.config.configureEditorPanel([
    {
      name: "source",
      type: "element",
      label: "Data Source"
    },
    {
      name: "score",
      type: "column",
      source: "source",
      label: "Deal Score",
      allowMultiple: false
    },
    {
      name: "revenue",
      type: "column",
      source: "source",
      label: "AAV Net",
      allowMultiple: false
    },
    {
      name: "company",
      type: "column",
      source: "source",
      label: "Company Name",
      allowMultiple: false
    },
    {
      name: "logo",
      type: "column",
      source: "source",
      label: "Logo URL",
      allowMultiple: false
    }
  ]);

  status.innerHTML =
    "<b>SUCCESS:</b> Sigma SDK connected and fields configured.";

} catch (e) {

  status.innerHTML =
    "<b>ERROR:</b> " + e.message;

}
</script>

</body>
</html>
