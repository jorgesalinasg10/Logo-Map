<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>

<body style="font-family:Arial;padding:20px">

<div id="status">Starting...</div>

<script src="https://cdn.jsdelivr.net/npm/@sigmacomputing/plugin@1.2.0/dist/umd/sigmacomputing-plugin.umd.js"></script>

<script>
const status = document.getElementById("status");

try {

  const client = window.SigmaPlugin.client;

  if (!client) {
    throw new Error(
      "Sigma client missing. Available SDK items: " +
      Object.keys(window.SigmaPlugin || {}).join(", ")
    );
  }

  if (
    !client.config ||
    typeof client.config.configureEditorPanel !== "function"
  ) {
    throw new Error(
      "configureEditorPanel missing. Config items: " +
      Object.keys(client.config || {}).join(", ")
    );
  }

  client.config.configureEditorPanel([
    {
      name: "source",
      label: "Data Source",
      type: "element"
    },
    {
      name: "score",
      label: "Deal Score",
      type: "column",
      source: "source",
      allowMultiple: false
    },
    {
      name: "revenue",
      label: "AAV Net",
      type: "column",
      source: "source",
      allowMultiple: false
    },
    {
      name: "company",
      label: "Company Name",
      type: "column",
      source: "source",
      allowMultiple: false
    },
    {
      name: "logo",
      label: "Logo URL",
      type: "column",
      source: "source",
      allowMultiple: false
    }
  ]);

  status.innerHTML =
    "<b>SUCCESS:</b> Sigma configuration connected.";

} catch (e) {

  status.innerHTML =
    "<b>ERROR:</b> " + e.message;

}
</script>

</body>
</html>
