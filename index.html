<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <script crossorigin
    src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>

  <script crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>

  <script
    src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js">
  </script>
</head>

<body style="font-family:Arial;padding:20px;">
<pre id="output">Waiting for Sigma...</pre>

<script>
const client = window.SigmaPlugin.client;
const output = document.getElementById("output");

client.config.configureEditorPanel([
  { name: "source", type: "element", label: "Data Source" },

  {
    name: "score",
    type: "column",
    source: "source",
    label: "Deal Score",
    allowMultiple: false
  },

  {
    name: "revenue",
    type: "column",
    source: "source",
    label: "AAV Net",
    allowMultiple: false
  },

  {
    name: "company",
    type: "column",
    source: "source",
    label: "Company Name",
    allowMultiple: false
  },

  {
    name: "logo",
    type: "column",
    source: "source",
    label: "Logo URL",
    allowMultiple: false
  }
]);

let config = client.config.get() || {};
let columns = {};
let data = {};

function show() {
  output.textContent = JSON.stringify({
    CONFIG: config,
    COLUMNS: columns,
    DATA_KEYS: Object.keys(data)
  }, null, 2);
}

client.config.subscribe(function(c) {
  config = c || {};
  show();
});

client.elements.subscribeToElementColumns(
  "source",
  function(c) {
    columns = c || {};
    show();
  }
);

client.elements.subscribeToElementData(
  "source",
  function(d) {
    data = d || {};
    show();
  }
);

show();
</script>

</body>
</html>
