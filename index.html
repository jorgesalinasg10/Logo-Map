<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script crossorigin
    src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>

  <script crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>

  <script
    src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: white;
    }

    #chart {
      width: 100%;
      height: 100%;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .grid {
      stroke: #e0e2e5;
      stroke-width: 1;
    }

    .axis {
      stroke: #888;
      stroke-width: 1;
    }

    .tick {
      fill: #666;
      font-size: 11px;
    }

    .title {
      fill: #222;
      font-size: 16px;
      font-weight: 600;
    }

    .axis-title {
      fill: #333;
      font-size: 12px;
      font-weight: 600;
    }

    .avg-line {
      stroke: #777;
      stroke-width: 1.3;
      stroke-dasharray: 5 4;
    }

    .avg-label {
      fill: #555;
      font-size: 10px;
    }

    .dot {
      fill: #5b9bd5;
      stroke: white;
      stroke-width: 1.5;
    }

    .logo {
      cursor: pointer;
    }

    #tooltip {
      position: fixed;
      display: none;
      pointer-events: none;
      background: rgba(25,25,25,.94);
      color: white;
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      z-index: 9999;
    }

    .message {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
    }
  </style>
</head>

<body>

<div id="chart">
  <div class="message">Loading Sigma data...</div>
</div>

<div id="tooltip"></div>

<script>

const client = window.SigmaPlugin.client;

client.config.configureEditorPanel([
  {
    name: "source",
    type: "element",
    label: "Data Source"
  },
  {
    name: "score",
    type: "column",
    source: "source",
    label: "Deal Score",
    allowMultiple: false
  },
  {
    name: "revenue",
    type: "column",
    source: "source",
    label: "AAV Net",
    allowMultiple: false
  },
  {
    name: "company",
    type: "column",
    source: "source",
    label: "Company Name",
    allowMultiple: false
  },
  {
    name: "logo",
    type: "column",
    source: "source",
    label: "Logo URL",
    allowMultiple: false
  }
]);

let config = client.config.get() || {};
let data = {};

let currentSource = null;
let stopData = null;

/*
  Stores already-normalized logos.

  Once a logo has been processed,
  we do not need to process it again.
*/

const normalizedLogoCache = new Map();
const logosBeingProcessed = new Set();

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function numeric(value) {

  if (typeof value === "number") {
    return Number.isFinite(value)
      ? value
      : null;
  }

  if (
    value === null ||
    value === undefined
  ) {
    return null;
  }

  const n = Number(
    String(value)
      .replace(/[$,%]/g, "")
      .trim()
  );

  return Number.isFinite(n)
    ? n
    : null;
}

function formatMoney(value) {

  return new Intl.NumberFormat(
    "en-US",
    {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 0
    }
  ).format(value);
}

/*
  ------------------------------------------------
  AUTOMATIC LOGO NORMALIZATION
  ------------------------------------------------

  This function:

  1. Loads the image
  2. Finds the visible logo
  3. Ignores transparent margins
  4. Ignores large white margins
  5. Crops the logo
  6. Centers it
  7. Places it into a standard square
  8. Preserves aspect ratio
*/

function normalizeLogo(url) {

  if (
    normalizedLogoCache.has(url)
  ) {
    return;
  }

  if (
    logosBeingProcessed.has(url)
  ) {
    return;
  }

  logosBeingProcessed.add(url);

  const img = new Image();

  /*
    Your GitHub Pages images are on the
    same site as the plugin, so this
    should allow us to inspect them.
  */

  img.crossOrigin = "anonymous";

  img.onload = function() {

    try {

      /*
        Keep processing reasonably small,
        even if someone uploads a huge image.
      */

      const maxProcessSize = 1000;

      let processWidth =
        img.naturalWidth;

      let processHeight =
        img.naturalHeight;

      if (
        processWidth > maxProcessSize ||
        processHeight > maxProcessSize
      ) {

        const scale =
          Math.min(
            maxProcessSize / processWidth,
            maxProcessSize / processHeight
          );

        processWidth =
          Math.round(
            processWidth * scale
          );

        processHeight =
          Math.round(
            processHeight * scale
          );
      }

      const canvas =
        document.createElement("canvas");

      canvas.width =
        processWidth;

      canvas.height =
        processHeight;

      const ctx =
        canvas.getContext(
          "2d",
          {
            willReadFrequently: true
          }
        );

      ctx.drawImage(
        img,
        0,
        0,
        processWidth,
        processHeight
      );

      const imageData =
        ctx.getImageData(
          0,
          0,
          processWidth,
          processHeight
        );

      const pixels =
        imageData.data;

      /*
        Estimate the background color
        from the four corners.

        This helps us recognize images
        that have a white background
        instead of transparency.
      */

      function getPixel(x, y) {

        const index =
          (
            y * processWidth +
            x
          ) * 4;

        return {
          r: pixels[index],
          g: pixels[index + 1],
          b: pixels[index + 2],
          a: pixels[index + 3]
        };
      }

      const corners = [
        getPixel(0, 0),
        getPixel(
          processWidth - 1,
          0
        ),
        getPixel(
          0,
          processHeight - 1
        ),
        getPixel(
          processWidth - 1,
          processHeight - 1
        )
      ];

      const averageCornerAlpha =
        corners.reduce(
          (sum, p) =>
            sum + p.a,
          0
        ) /
        corners.length;

      const backgroundTransparent =
        averageCornerAlpha < 50;

      const backgroundColor = {

        r:
          corners.reduce(
            (sum, p) =>
              sum + p.r,
            0
          ) /
          corners.length,

        g:
          corners.reduce(
            (sum, p) =>
              sum + p.g,
            0
          ) /
          corners.length,

        b:
          corners.reduce(
            (sum, p) =>
              sum + p.b,
            0
          ) /
          corners.length
      };

      let minX =
        processWidth;

      let minY =
        processHeight;

      let maxX = -1;
      let maxY = -1;

      /*
        Determines whether a pixel is
        part of the visible logo.
      */

      function isVisiblePixel(
        r,
        g,
        b,
        a
      ) {

        /*
          Fully transparent pixels
          are always background.
        */

        if (a < 20) {
          return false;
        }

        /*
          Transparent-background PNG.
        */

        if (backgroundTransparent) {
          return true;
        }

        /*
          For white or solid-background
          images, compare each pixel to
          the background color.
        */

        const redDifference =
          r - backgroundColor.r;

        const greenDifference =
          g - backgroundColor.g;

        const blueDifference =
          b - backgroundColor.b;

        const distance =
          Math.sqrt(
            redDifference *
            redDifference +

            greenDifference *
            greenDifference +

            blueDifference *
            blueDifference
          );

        /*
          Higher number means we ignore
          more subtle background noise.
        */

        return distance > 28;
      }

      /*
        Scan every pixel and find the
        visible logo boundaries.
      */

      for (
        let y = 0;
        y < processHeight;
        y++
      ) {

        for (
          let x = 0;
          x < processWidth;
          x++
        ) {

          const index =
            (
              y * processWidth +
              x
            ) * 4;

          const r =
            pixels[index];

          const g =
            pixels[index + 1];

          const b =
            pixels[index + 2];

          const a =
            pixels[index + 3];

          if (
            isVisiblePixel(
              r,
              g,
              b,
              a
            )
          ) {

            if (x < minX) minX = x;
            if (x > maxX) maxX = x;

            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      /*
        If nothing was detected,
        just use the original image.
      */

      if (
        maxX < minX ||
        maxY < minY
      ) {

        normalizedLogoCache.set(
          url,
          url
        );

        logosBeingProcessed.delete(
          url
        );

        render();

        return;
      }

      let cropWidth =
        maxX -
        minX +
        1;

      let cropHeight =
        maxY -
        minY +
        1;

      /*
        Add a small amount of padding
        around the actual logo so it
        doesn't feel cramped.
      */

      const paddingX =
        Math.round(
          cropWidth * 0.05
        );

      const paddingY =
        Math.round(
          cropHeight * 0.05
        );

      minX =
        Math.max(
          0,
          minX - paddingX
        );

      minY =
        Math.max(
          0,
          minY - paddingY
        );

      maxX =
        Math.min(
          processWidth - 1,
          maxX + paddingX
        );

      maxY =
        Math.min(
          processHeight - 1,
          maxY + paddingY
        );

      cropWidth =
        maxX -
        minX +
        1;

      cropHeight =
        maxY -
        minY +
        1;

      /*
        Every normalized logo gets
        placed onto the same
        500 × 500 canvas.
      */

      const outputSize = 500;

      const outputCanvas =
        document.createElement(
          "canvas"
        );

      outputCanvas.width =
        outputSize;

      outputCanvas.height =
        outputSize;

      const outputContext =
        outputCanvas.getContext(
          "2d"
        );

      /*
        The visible logo occupies
        approximately 86% of the
        normalized canvas.

        This makes different logos
        feel much more consistent.
      */

      const targetSize =
        outputSize * 0.86;

      const fitScale =
        Math.min(
          targetSize / cropWidth,
          targetSize / cropHeight
        );

      const drawWidth =
        cropWidth *
        fitScale;

      const drawHeight =
        cropHeight *
        fitScale;

      const drawX =
        (
          outputSize -
          drawWidth
        ) / 2;

      const drawY =
        (
          outputSize -
          drawHeight
        ) / 2;

      outputContext.drawImage(
        canvas,

        minX,
        minY,
        cropWidth,
        cropHeight,

        drawX,
        drawY,
        drawWidth,
        drawHeight
      );

      const normalizedUrl =
        outputCanvas.toDataURL(
          "image/png"
        );

      normalizedLogoCache.set(
        url,
        normalizedUrl
      );

      logosBeingProcessed.delete(
        url
      );

      /*
        Re-render after normalization
        is complete.
      */

      render();

    } catch (error) {

      /*
        If anything goes wrong,
        fall back to the original logo.
      */

      normalizedLogoCache.set(
        url,
        url
      );

      logosBeingProcessed.delete(
        url
      );

      render();
    }
  };

  img.onerror = function() {

    normalizedLogoCache.set(
      url,
      url
    );

    logosBeingProcessed.delete(
      url
    );

    render();
  };

  img.src = url;
}

/*
  Get either the normalized version
  or temporarily use the original
  while normalization is happening.
*/

function getLogoUrl(url) {

  if (
    normalizedLogoCache.has(url)
  ) {

    return normalizedLogoCache.get(
      url
    );
  }

  normalizeLogo(url);

  return url;
}

function connectData() {

  if (!config.source) {
    return;
  }

  if (
    config.source === currentSource
  ) {

    render();
    return;
  }

  currentSource =
    config.source;

  if (stopData) {
    stopData();
  }

  stopData =
    client.elements.subscribeToElementData(
      config.source,
      function(nextData) {

        data =
          nextData || {};

        render();
      }
    );
}

function render() {

  const container =
    document.getElementById(
      "chart"
    );

  if (
    !config.score ||
    !config.revenue
  ) {

    container.innerHTML =
      '<div class="message">Select Deal Score and AAV Net.</div>';

    return;
  }

  const scores =
    data[config.score] || [];

  const revenues =
    data[config.revenue] || [];

  const companies =
    config.company
      ? data[config.company] || []
      : [];

  const logos =
    config.logo
      ? data[config.logo] || []
      : [];

  /*
    LOGO MODE DETECTION
  */

  const logoMode =
    logos.some(
      logo =>
        logo &&
        /^https?:\/\//i.test(
          String(logo)
        )
    );

  /*
    Logo mode = light gray
    Dot mode = white
  */

  const backgroundColor =
    logoMode
      ? "#EEF0F2"
      : "#FFFFFF";

  container.style.background =
    backgroundColor;

  document.body.style.background =
    backgroundColor;

  document.documentElement.style.background =
    backgroundColor;

  if (
    !scores.length ||
    !revenues.length
  ) {

    container.innerHTML =
      '<div class="message">Waiting for Sigma data...</div>';

    return;
  }

  const rowCount =
    Math.min(
      scores.length,
      revenues.length
    );

  const points = [];

  for (
    let i = 0;
    i < rowCount;
    i++
  ) {

    const x =
      numeric(scores[i]);

    const y =
      numeric(revenues[i]);

    if (
      x === null ||
      y === null
    ) {
      continue;
    }

    points.push({
      x: x,
      y: y,
      company:
        companies[i] || "",
      logo:
        logos[i] || ""
    });
  }

  if (!points.length) {

    container.innerHTML =
      '<div class="message">No valid rows found.</div>';

    return;
  }

  const width = 1000;
  const height = 560;

  const margin = {
    top: 50,
    right: 45,
    bottom: 65,
    left: 95
  };

  const plotWidth =
    width -
    margin.left -
    margin.right;

  const plotHeight =
    height -
    margin.top -
    margin.bottom;

  const xs =
    points.map(
      p => p.x
    );

  const ys =
    points.map(
      p => p.y
    );

  const scoreIsDecimal =
    Math.max(...xs) <= 1.5;

  let minX =
    Math.min(...xs);

  let maxX =
    Math.max(...xs);

  let maxY =
    Math.max(...ys);

  const xPadding =
    Math.max(
      (maxX - minX) * .07,
      scoreIsDecimal
        ? .01
        : 1
    );

  minX -= xPadding;
  maxX += xPadding;

  if (scoreIsDecimal) {

    minX =
      Math.max(
        0,
        minX
      );

    maxX =
      Math.min(
        1,
        maxX
      );
  }

  maxY *= 1.08;

  function sx(value) {

    return margin.left +
      (
        (value - minX) /
        (maxX - minX || 1)
      ) *
      plotWidth;
  }

  function sy(value) {

    return margin.top +
      plotHeight -
      (
        value /
        maxY
      ) *
      plotHeight;
  }

  function formatScore(value) {

    if (scoreIsDecimal) {

      return (
        value * 100
      ).toFixed(0) + "%";
    }

    return value.toFixed(0) + "%";
  }

  const avgX =
    xs.reduce(
      (sum, value) =>
        sum + value,
      0
    ) /
    xs.length;

  const avgY =
    ys.reduce(
      (sum, value) =>
        sum + value,
      0
    ) /
    ys.length;

  /*
    Actual SVG gets the background color
    so Sigma cannot override it.
  */

  let svg =
    `<svg viewBox="0 0 ${width} ${height}">
      <rect
        x="0"
        y="0"
        width="${width}"
        height="${height}"
        fill="${backgroundColor}"
      />`;

  svg += `
    <text
      class="title"
      x="18"
      y="25"
    >
      Deal Score Plot in Relation to Revenue
    </text>
  `;

  const ySteps = 8;

  for (
    let i = 0;
    i <= ySteps;
    i++
  ) {

    const value =
      maxY *
      i /
      ySteps;

    const y =
      sy(value);

    svg += `
      <line
        class="grid"
        x1="${margin.left}"
        y1="${y}"
        x2="${width-margin.right}"
        y2="${y}"
      />

      <text
        class="tick"
        x="${margin.left-10}"
        y="${y+4}"
        text-anchor="end"
      >
        ${formatMoney(value)}
      </text>
    `;
  }

  const xSteps = 8;

  for (
    let i = 0;
    i <= xSteps;
    i++
  ) {

    const value =
      minX +
      (
        (maxX-minX) *
        i /
        xSteps
      );

    const x =
      sx(value);

    svg += `
      <line
        class="grid"
        x1="${x}"
        y1="${margin.top}"
        x2="${x}"
        y2="${height-margin.bottom}"
      />

      <text
        class="tick"
        x="${x}"
        y="${height-margin.bottom+22}"
        text-anchor="middle"
      >
        ${formatScore(value)}
      </text>
    `;
  }

  svg += `
    <line
      class="axis"
      x1="${margin.left}"
      y1="${height-margin.bottom}"
      x2="${width-margin.right}"
      y2="${height-margin.bottom}"
    />

    <line
      class="axis"
      x1="${margin.left}"
      y1="${margin.top}"
      x2="${margin.left}"
      y2="${height-margin.bottom}"
    />
  `;

  svg += `
    <line
      class="avg-line"
      x1="${sx(avgX)}"
      y1="${margin.top}"
      x2="${sx(avgX)}"
      y2="${height-margin.bottom}"
    />

    <text
      class="avg-label"
      x="${sx(avgX)+5}"
      y="${margin.top+13}"
    >
      Avg Deal Score
    </text>

    <line
      class="avg-line"
      x1="${margin.left}"
      y1="${sy(avgY)}"
      x2="${width-margin.right}"
      y2="${sy(avgY)}"
    />

    <text
      class="avg-label"
      x="${width-margin.right-5}"
      y="${sy(avgY)-6}"
      text-anchor="end"
    >
      Avg AAV Net
    </text>
  `;

  svg += `
    <text
      class="axis-title"
      x="${margin.left + plotWidth/2}"
      y="${height-15}"
      text-anchor="middle"
    >
      Deal Score
    </text>

    <text
      class="axis-title"
      transform="translate(
        22
        ${margin.top + plotHeight/2}
      ) rotate(-90)"
      text-anchor="middle"
    >
      AAV Net
    </text>
  `;

  /*
    POINTS
  */

  points.forEach(
    function(point, index) {

      const x =
        sx(point.x);

      const y =
        sy(point.y);

      svg += `
        <g
          class="point"
          data-index="${index}"
        >
      `;

      if (
        point.logo &&
        /^https?:\/\//i.test(
          String(point.logo)
        )
      ) {

        /*
          Automatically use the
          normalized logo.
        */

        const displayLogo =
          getLogoUrl(
            point.logo
          );

        svg += `
          <image
            class="logo"
            x="${x-45}"
            y="${y-45}"
            width="90"
            height="90"
            href="${escapeHtml(displayLogo)}"
            preserveAspectRatio="xMidYMid meet"
          />
        `;

      } else {

        svg += `
          <circle
            class="dot"
            cx="${x}"
            cy="${y}"
            r="6"
          />
        `;
      }

      svg += `</g>`;
    }
  );

  svg += `</svg>`;

  container.innerHTML =
    svg;

  const tooltip =
    document.getElementById(
      "tooltip"
    );

  container
    .querySelectorAll(".point")
    .forEach(
      function(element) {

        const point =
          points[
            Number(
              element.dataset.index
            )
          ];

        element.addEventListener(
          "mousemove",
          function(event) {

            tooltip.innerHTML =
              `<strong>${escapeHtml(
                point.company ||
                "Company"
              )}</strong>
              <br>
              Deal Score:
              ${formatScore(
                point.x
              )}
              <br>
              AAV Net:
              ${formatMoney(
                point.y
              )}`;

            tooltip.style.display =
              "block";

            tooltip.style.left =
              event.clientX +
              12 +
              "px";

            tooltip.style.top =
              event.clientY +
              12 +
              "px";
          }
        );

        element.addEventListener(
          "mouseleave",
          function() {

            tooltip.style.display =
              "none";
          }
        );
      }
    );
}

client.config.subscribe(
  function(nextConfig) {

    config =
      nextConfig || {};

    connectData();
    render();
  }
);

config =
  client.config.get() || {};

connectData();

</script>

</body>
</html>
