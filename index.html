<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>

<body style="font-family:Arial;padding:20px">

<div id="status">Starting...</div>

<script
  crossorigin
  src="https://unpkg.com/react@18/umd/react.production.min.js">
</script>

<script
  crossorigin
  src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
</script>

<script
  src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js">
</script>

<script>
const status = document.getElementById("status");

try {

  const client = window.SigmaPlugin.client;

  if (!client) {
    throw new Error("Sigma client not found");
  }

  client.config.configureEditorPanel([
    {
      name: "source",
      type: "element",
      label: "Data Source"
    },
    {
      name: "score",
      type: "column",
      source: "source",
      label: "Deal Score",
      allowMultiple: false
    },
    {
      name: "revenue",
      type: "column",
      source: "source",
      label: "AAV Net",
      allowMultiple: false
    },
    {
      name: "company",
      type: "column",
      source: "source",
      label: "Company Name",
      allowMultiple: false
    },
    {
      name: "logo",
      type: "column",
      source: "source",
      label: "Logo URL",
      allowMultiple: false
    }
  ]);

  status.innerHTML =
    "<b>SUCCESS:</b> Sigma fields configured.";

} catch (e) {

  status.innerHTML =
    "<b>ERROR:</b> " + e.message;

}
</script>

</body>
</html>
