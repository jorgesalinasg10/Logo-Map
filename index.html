<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <script crossorigin
    src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>

  <script crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>

  <script
    src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js">
  </script>
</head>

<body style="font-family:Arial;padding:20px;">
<pre id="output">Waiting for Sigma...</pre>

<script>
const client = window.SigmaPlugin.client;
const output = document.getElementById("output");

client.config.configureEditorPanel([
  { name: "source", type: "element", label: "Data Source" },

  {
    name: "score",
    type: "column",
    source: "source",
    label: "Deal Score",
    allowMultiple: false
  },

  {
    name: "revenue",
    type: "column",
    source: "source",
    label: "AAV Net",
    allowMultiple: false
  },

  {
    name: "company",
    type: "column",
    source: "source",
    label: "Company Name",
    allowMultiple: false
  },

  {
    name: "logo",
    type: "column",
    source: "source",
    label: "Logo URL",
    allowMultiple: false
  }
]);

let config = {};
let data = {};
let columns = {};

let stopData = null;
let stopColumns = null;
let currentSource = null;

function show() {
  output.textContent = JSON.stringify({
    SOURCE: config.source || null,
    SCORE: config.score || null,
    REVENUE: config.revenue || null,
    COMPANY: config.company || null,
    COLUMN_KEYS: Object.keys(columns),
    DATA_KEYS: Object.keys(data),
    ROW_COUNTS: Object.fromEntries(
      Object.entries(data).map(([key, values]) => [
        key,
        Array.isArray(values) ? values.length : 0
      ])
    )
  }, null, 2);
}

function connectToSource() {

  if (!config.source) return;

  if (config.source === currentSource) return;

  currentSource = config.source;

  if (stopData) stopData();
  if (stopColumns) stopColumns();

  stopColumns =
    client.elements.subscribeToElementColumns(
      config.source,
      function(nextColumns) {
        columns = nextColumns || {};
        show();
      }
    );

  stopData =
    client.elements.subscribeToElementData(
      config.source,
      function(nextData) {
        data = nextData || {};
        show();
      }
    );
}

client.config.subscribe(function(nextConfig) {
  config = nextConfig || {};
  show();
  connectToSource();
});

config = client.config.get() || {};
show();
connectToSource();
</script>

</body>
</html>
